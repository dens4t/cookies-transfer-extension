<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 400px; padding: 12px; font-family: system-ui; font-size: 14px; }
    button { width: 100%; padding: 10px; margin: 6px 0; cursor: pointer; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; }
    #export-btn { background: #1a73e8; color: #fff; }
    #import-btn { background: #34a853; color: #fff; }
    #clear-btn { background: #ea4335; color: #fff; }
    button:hover { opacity: 0.9; }
    textarea { width: 100%; height: 200px; margin: 6px 0; font-family: monospace; font-size: 11px; resize: vertical; box-sizing: border-box; }
    #status { margin-top: 8px; padding: 6px; border-radius: 4px; display: none; font-size: 12px; }
    #status.success { display: block; background: #e6f4ea; color: #137333; }
    #status.error { display: block; background: #fce8e6; color: #c5221f; }
    h3 { margin: 0 0 8px 0; }
  </style>
</head>
<body>
  <h3>🍪 Cookies Transfer All</h3>
  <button id="export-btn">Export ALL Cookies</button>
  <textarea id="data" placeholder="JSON cookies akan muncul di sini..."></textarea>
  <button id="import-btn">Import Cookies</button>
  <button id="clear-btn">Clear ALL Cookies</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
